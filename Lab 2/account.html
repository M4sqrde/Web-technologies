<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Kudachenko Dmitrii Lab 2</title>
</head>
<body class="auth">
    <form action="https://httpbin.org/post" method="post" class="auth">
        <div>
            <h1>Войти в аккаунт</h1>
        </div>
        <div>
            <label for="login">Логин</label>
            <input class="pole" type="text" id="login" name="login" placeholder="Введите логин">
        </div>
        <div>
            <label for="password">Пароль</label>
            <input class="pole" type="password" id="password" name="password" placeholder="Введите пароль">
        </div>
        <div>
            <label for="checkbox">Запомнить меня</label>
            <input type="checkbox" id="checkbox" name="remember" class="chk">
        </div>
        <button class="btn" type="submit">Войти</button>
    </form>
</body>
</html>
