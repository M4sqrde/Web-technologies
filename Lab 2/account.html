<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Laboratory Work 2 </title>
</head>
<body class="bg">

    <div class="authf">
        <form class="authfr" action="https://httpbin.org/post" method="post">
            <h2 class="ttl">Вход в аккаунт</h2>

            <div class="auth">
                <label class="authl" for="login">Логин</label>
                <input class="authi" type="text" name="login" id="login" placeholder="Введите логин" required>
            </div>

            <div class="auth">
                <label class="authl" for="password">Пароль</label>
                <input class="authi" type="password" name="password" id="password" placeholder="Введите пароль" required>
            </div>

            <div class="authc">
                <input type="checkbox" name="remember" id="remember">
                <label for="remember">Запомнить меня</label>
            </div>

            <button class="auth-btn" type="submit">Войти</button>
        </form>
    </div>

</body>
</html>
